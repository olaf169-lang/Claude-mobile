name: Jaka to Melodia

# Aplikacja publikuje się razem z Przeglądem News (workflow przeglad.yml
# dokłada katalog jaka-to-melodia/ do wydania Pages jako podstronę). Tutaj
# zostaje to, co trzeba sprawdzić przy każdej zmianie, oraz comiesięczne
# dociąganie 30-sekundowych podglądów ze sklepu.
on:
  push:
    paths:
      - "jaka-to-melodia/**"
      - ".github/workflows/jaka-to-melodia.yml"
  # Pierwszego dnia miesiąca sprawdzamy, czy nagrania nadal się otwierają
  # i czy nie doszły utwory bez podglądu.
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      odswiez:
        description: "Pobrać wszystkie podglądy od nowa (tak/nie)"
        required: false
        default: "nie"

permissions:
  contents: write

concurrency:
  group: jaka-to-melodia
  cancel-in-progress: false

jobs:
  sprawdz:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zainstaluj zależności testowe
        working-directory: jaka-to-melodia
        run: npm install --no-audit --no-fund

      - name: Kontrola katalogu utworów
        working-directory: jaka-to-melodia
        run: node narzedzia/sprawdz-dane.mjs

      - name: Silnik gry
        working-directory: jaka-to-melodia
        run: node narzedzia/test-gry.mjs

      - name: Połączenie między telefonami
        working-directory: jaka-to-melodia
        run: node narzedzia/test-polaczenia.mjs

      - name: Dobieranie nagrań
        working-directory: jaka-to-melodia
        run: node narzedzia/test-narzedzi.mjs

      - name: Przeglądarka — pełna rozgrywka
        working-directory: jaka-to-melodia
        run: |
          npx playwright install --with-deps chromium
          node narzedzia/test-przegladarki.mjs

  podglady:
    name: Dociągnij nagrania
    runs-on: ubuntu-latest
    needs: sprawdz
    # Własny commit z podglądami nie ma odpalać workflowu od nowa.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[podglady]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Wyszukiwarka iTunes przycina zbyt gęste pytania, więc idziemy spokojnie.
      # Pierwszy przebieg (cały katalog) trwa kilkanaście minut, kolejne —
      # tylko tyle, ile dopisanych utworów.
      - name: Pobierz podglądy
        working-directory: jaka-to-melodia
        timeout-minutes: 45
        run: |
          node narzedzia/pobierz-podglady.mjs \
            ${{ github.event.inputs.odswiez == 'tak' && '--odswiez' || '' }}

      - name: Zapisz w repozytorium
        working-directory: jaka-to-melodia
        run: |
          set -euo pipefail
          git config user.name "Jaka to Melodia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/podglady.json
          if git diff --cached --quiet; then
            echo "Nic nowego do pobrania."
            exit 0
          fi
          git commit -m "Podglądy utworów [podglady]"
          for proba in 1 2 3 4; do
            if git push; then break; fi
            echo "Push nieudany, ponawiam za $((2**proba))s"
            sleep $((2**proba))
            git pull --rebase
          done
