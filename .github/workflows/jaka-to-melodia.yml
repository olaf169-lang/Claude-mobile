name: Jaka to Melodia

# Aplikacja publikuje się razem z Przeglądem News (workflow przeglad.yml
# dokłada katalog jaka-to-melodia/ do wydania Pages jako podstronę). Tutaj
# zostaje to, co trzeba sprawdzić przy każdej zmianie, oraz comiesięczne
# dociąganie 30-sekundowych podglądów ze sklepu.
on:
  push:
    paths:
      - "jaka-to-melodia/**"
      - ".github/workflows/jaka-to-melodia.yml"
  # Pierwszego dnia miesiąca sprawdzamy, czy nagrania nadal się otwierają
  # i czy nie doszły utwory bez podglądu.
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      odswiez:
        description: "Pobrać wszystkie podglądy od nowa (tak/nie)"
        required: false
        default: "nie"

permissions:
  contents: write

concurrency:
  group: jaka-to-melodia
  cancel-in-progress: false

jobs:
  sprawdz:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zainstaluj zależności testowe
        working-directory: jaka-to-melodia
        run: npm install --no-audit --no-fund

      - name: Kontrola katalogu utworów
        working-directory: jaka-to-melodia
        run: node narzedzia/sprawdz-dane.mjs

      - name: Silnik gry
        working-directory: jaka-to-melodia
        run: node narzedzia/test-gry.mjs

      - name: Połączenie między telefonami
        working-directory: jaka-to-melodia
        run: node narzedzia/test-polaczenia.mjs

      - name: Dobieranie nagrań
        working-directory: jaka-to-melodia
        run: node narzedzia/test-narzedzi.mjs

      - name: Przeglądarka — pełna rozgrywka
        working-directory: jaka-to-melodia
        run: |
          npx playwright install --with-deps chromium
          node narzedzia/test-przegladarki.mjs

  podglady:
    name: Nagrania — część ${{ matrix.czesc }}
    runs-on: ubuntu-latest
    needs: sprawdz
    # Własny commit z podglądami nie ma odpalać workflowu od nowa.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[podglady]') }}
    strategy:
      fail-fast: false
      # Wyszukiwarka iTunes przepuszcza około dwudziestu zapytań na minutę
      # z jednego adresu — cały katalog na jednej maszynie zajmowałby godzinę.
      # Pięć równoległych części to pięć różnych adresów i pięć osobnych
      # limitów; każda schodzi poniżej dziesięciu minut.
      matrix:
        czesc: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pobierz podglądy
        working-directory: jaka-to-melodia
        timeout-minutes: 25
        run: |
          node narzedzia/pobierz-podglady.mjs \
            --czesc ${{ matrix.czesc }} --z 5 \
            --plik czesc-${{ matrix.czesc }}.json \
            ${{ github.event.inputs.odswiez == 'tak' && '--odswiez' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: podglady-${{ matrix.czesc }}
          path: jaka-to-melodia/czesc-${{ matrix.czesc }}.json
          if-no-files-found: error

  scal:
    name: Złóż i zapisz
    runs-on: ubuntu-latest
    needs: podglady
    # Nawet gdy jedna część polegnie, reszta ma trafić do repozytorium.
    if: ${{ !cancelled() && needs.podglady.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          pattern: podglady-*
          merge-multiple: true
          path: czesci

      - name: Złóż części w jeden plik
        working-directory: jaka-to-melodia
        run: node narzedzia/scal-podglady.mjs ../czesci/*.json --plik dane/podglady.json

      - name: Zapisz w repozytorium
        working-directory: jaka-to-melodia
        run: |
          set -euo pipefail
          git config user.name "Jaka to Melodia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/podglady.json
          if git diff --cached --quiet; then
            echo "Nic nowego do pobrania."
            exit 0
          fi
          git commit -m "Podglądy utworów [podglady]"
          for proba in 1 2 3 4; do
            if git push; then break; fi
            echo "Push nieudany, ponawiam za $((2**proba))s"
            sleep $((2**proba))
            git pull --rebase
          done
