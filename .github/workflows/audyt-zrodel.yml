name: Audyt źródeł

# 18. dnia miesiąca: sprawdź wszystkie kanały, martwe podmień na sprawdzone
# zamienniki z rezerwy i wypchnij zmianę.
# 19. dnia: sprawdź, czy naprawa się udała, i popraw to, co zostało.
# Obie daty w czasie polskim (6:00 UTC = 8:00 latem, 7:00 zimą — audyt nie
# jest wrażliwy na godzinę, więc jeden cron wystarczy).
on:
  schedule:
    - cron: "0 6 18 * *"
    - cron: "0 6 19 * *"
  workflow_dispatch:
    inputs:
      napraw:
        description: "Podmieniać martwe kanały (tak/nie)"
        required: false
        default: "tak"

permissions:
  contents: write
  issues: write

concurrency:
  group: audyt-zrodel

jobs:
  audyt:
    name: Sprawdź i napraw źródła
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Który to przebieg?
        id: tryb
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          dzien = datetime.now(ZoneInfo("Europe/Warsaw")).day
          reczne = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          # 18. naprawiamy, 19. tylko kontrolujemy — chyba że kontrola wykryje
          # problemy, wtedy krok niżej i tak podejmuje drugą próbę naprawy.
          napraw = reczne or dzien != 19
          print(f"napraw={'true' if napraw else 'false'}")
          print(f"etap={'kontrola' if dzien == 19 and not reczne else 'audyt'}")
          PY

      - name: Audyt
        id: audyt
        continue-on-error: true
        run: |
          if [ "${{ steps.tryb.outputs.napraw }}" = "true" ]; then
            python -m collector.audyt --napraw --raport raport.md
          else
            python -m collector.audyt --raport raport.md
          fi

      - name: Druga próba, gdy kontrola znalazła problemy
        if: steps.tryb.outputs.etap == 'kontrola' && steps.audyt.outcome == 'failure'
        run: |
          echo "Kontrola wykazała ubytki — naprawiam."
          python -m collector.audyt --napraw --raport raport.md || true

      - name: Testy po zmianie katalogu
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Zapisz zmiany w katalogu
        id: zapis
        run: |
          set -euo pipefail
          git config user.name "Przegląd News"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/sources.py
          if git diff --cached --quiet; then
            echo "Katalog bez zmian."
            echo "zmieniono=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Audyt źródeł: podmiana kanałów, które przestały odpowiadać"
            for proba in 1 2 3 4; do
              if git push; then break; fi
              sleep $((2**proba)); git pull --rebase
            done
            echo "zmieniono=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś wynik
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raport = fs.readFileSync('raport.md', 'utf8');
            const etap = '${{ steps.tryb.outputs.etap }}';
            const zmieniono = '${{ steps.zapis.outputs.zmieniono }}' === 'true';
            const czysto = '${{ steps.audyt.outcome }}' === 'success';

            // Cicho tylko wtedy, gdy kontrola nie znalazła nic do poprawy.
            if (etap === 'kontrola' && czysto && !zmieniono) {
              core.notice('Kontrola: katalog źródeł w porządku, nie zgłaszam nic.');
              return;
            }

            const dzis = new Date().toISOString().slice(0, 10);
            const tytul = etap === 'kontrola'
              ? `Kontrola źródeł ${dzis}`
              : `Audyt źródeł ${dzis}`;
            const stopka = zmieniono
              ? '\n\nKatalog został zaktualizowany — zmiany są już w repozytorium.'
              : '\n\nKatalog nie wymagał zmian w kodzie.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: tytul,
              body: raport + stopka,
              labels: ['źródła'],
            });
