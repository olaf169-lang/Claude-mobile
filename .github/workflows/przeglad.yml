name: Przegląd News — wydanie poranne

# Wydanie powstaje o 8:00 czasu polskiego z newsów z dnia poprzedniego.
# GitHub liczy cron w UTC i nie zna czasu letniego, więc odpalamy dwa razy
# (6:00 i 7:00 UTC), a krok kontrolny przepuszcza tylko ten przebieg, który
# trafia w polską ósmą i nie powiela już zbudowanego wydania.
on:
  # Zmiana tego pliku od razu buduje wydanie. To także sposób, w jaki GitHub
  # w ogóle poznaje workflow — dopóki nic go nie uruchomi, nie pojawia się
  # na liście Actions i nie da się go odpalić ręcznie.
  # Zmiana strony lub tego pliku publikuje wydanie od nowa. Bez tego poprawki
  # wyglądu czekałyby na stronie do następnej porannej zbiórki.
  push:
    paths:
      - "web/**"
      - "bangladesz26/**"
      - "jaka-to-melodia/**"
      - ".github/workflows/przeglad.yml"
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Data wydania (RRRR-MM-DD), domyślnie dziś"
        required: false
      dotyczy:
        description: "Dzień, z którego brać newsy (RRRR-MM-DD), domyślnie dzień wcześniej"
        required: false

concurrency:
  group: przeglad-news
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  zbierz:
    name: Zbierz newsy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Czy to właściwa pora?
        id: kontrola
        run: |
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo

          zdarzenie = os.environ["GITHUB_EVENT_NAME"]
          teraz = datetime.now(ZoneInfo("Europe/Warsaw"))
          plik = pathlib.Path(f"web/data/{teraz:%Y-%m-%d}.json")

          def decyzja() -> tuple[bool, str]:
              if zdarzenie == "push":
                  # Zmiana w repozytorium ma tylko opublikować stronę.
                  return False, "push — publikuję gotowe wydanie bez zbierania"
              if zdarzenie == "workflow_dispatch":
                  return True, "uruchomienie ręczne"
              if teraz.hour < 8:
                  return False, "za wcześnie — to przebieg dla drugiej strefy czasowej"
              if not plik.exists():
                  return True, "po ósmej i brak dzisiejszego wydania"
              # Wydanie zbudowane w nocy (np. ręcznym testem) nie zastępuje
              # porannego: to ono ma się pojawić o ósmej i wywołać powiadomienie.
              try:
                  powstalo = datetime.fromisoformat(
                      json.loads(plik.read_text("utf-8"))["wygenerowano"]
                  ).astimezone(ZoneInfo("Europe/Warsaw"))
              except Exception:
                  return True, "nie umiem odczytać dzisiejszego wydania — buduję na nowo"
              poranek = datetime.combine(teraz.date(), time(7), tzinfo=ZoneInfo("Europe/Warsaw"))
              if powstalo >= poranek:
                  return False, f"poranne wydanie już powstało o {powstalo:%H:%M}"
              return True, f"dzisiejsze wydanie jest sprzed poranka ({powstalo:%H:%M}) — buduję świeże"

          buduj, powod = decyzja()
          # Wynik kroku idzie do pliku, komunikat na konsolę. Wcześniej jedno
          # przekierowanie obejmowało oba i GitHub odrzucał całą linię ::notice::.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as wyjscie:
              wyjscie.write(f"uruchom={'true' if buduj else 'false'}\n")
          print(f"::notice::{powod}")
          PY

      - uses: actions/setup-python@v5
        if: steps.kontrola.outputs.uruchom == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        if: steps.kontrola.outputs.uruchom == 'true'
        run: pip install -r requirements.txt

      - name: Zbierz wydanie
        if: steps.kontrola.outputs.uruchom == 'true'
        env:
          # Klucz jest opcjonalny. Bez niego przegląd powstaje w trybie
          # ekstrakcyjnym (cytaty ze źródeł), z nim — pogłębione omówienia po polsku.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Twój adres podnosi dzienny limit darmowego tłumacza z ok. 5 tys.
          # do 50 tys. znaków. Bez niego przegląd tłumaczy tyle, ile zdąży.
          PRZEGLAD_TLUMACZ_EMAIL: ${{ secrets.PRZEGLAD_TLUMACZ_EMAIL }}
        run: |
          python -m collector.build \
            ${{ github.event.inputs.data && format('--date {0}', github.event.inputs.data) || '' }} \
            ${{ github.event.inputs.dotyczy && format('--covers {0}', github.event.inputs.dotyczy) || '' }} \
            --out web/data

      - name: Zapisz wydanie w repozytorium
        if: steps.kontrola.outputs.uruchom == 'true'
        run: |
          set -euo pipefail
          git config user.name "Przegląd News"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "Wydanie z $(TZ=Europe/Warsaw date +%F)"
            for proba in 1 2 3 4; do
              if git push; then break; fi
              echo "Push nieudany, ponawiam za $((2**proba))s"
              sleep $((2**proba))
              git pull --rebase
            done
          fi

      - name: Podsumowanie
        if: steps.kontrola.outputs.uruchom == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("web/data/latest.json").read_text("utf-8"))
          print(f"## Wydanie {d['wydanie']} (newsy z {d['dotyczy_dnia']})\n")
          print(f"Tryb: **{d['tryb']}** · kanały: {d['statystyki'].get('kanały_ok', 0)} ok, "
                f"{d['statystyki'].get('kanały_błędne', 0)} błędne\n")
          for item in d["pozycje"]:
              seg = item["dział"]
              print(f"- {seg['emoji']} **{seg['nazwa']}** — {item['nagłówek']} "
                    f"_({item['liczba_źródeł']} źr., {item['źródło']['nazwa']})_")
          if d["braki"]:
              print(f"\n⚠️ Brak materiału w działach: {', '.join(d['braki'])}")
          PY

      # Druga aplikacja z repozytorium jedzie tym samym wydaniem Pages, tyle że
      # pod adresem /bangladesz26/. Kopiujemy tylko to, co ma stanąć na stronie —
      # narzędzia, zrzuty i README zostają w repozytorium.
      - name: Dołóż BANGladesz26 do strony
        run: |
          set -euo pipefail
          rm -rf web/bangladesz26
          mkdir -p web/bangladesz26
          cp -r bangladesz26/. web/bangladesz26/
          rm -rf web/bangladesz26/narzedzia web/bangladesz26/docs \
                 web/bangladesz26/dist web/bangladesz26/README.md web/bangladesz26/.gitignore
          test -f web/bangladesz26/index.html

      # Trzecia aplikacja z repozytorium, pod adresem /jaka-to-melodia/.
      # Na stronę idzie tylko to, co ma działać w przeglądarce — narzędzia,
      # zrzuty i README zostają w repozytorium.
      - name: Dołóż Jaką to Melodię do strony
        run: |
          set -euo pipefail
          rm -rf web/jaka-to-melodia
          mkdir -p web/jaka-to-melodia
          cp -r jaka-to-melodia/. web/jaka-to-melodia/
          rm -rf web/jaka-to-melodia/narzedzia web/jaka-to-melodia/docs \
                 web/jaka-to-melodia/node_modules web/jaka-to-melodia/README.md \
                 web/jaka-to-melodia/package.json web/jaka-to-melodia/package-lock.json \
                 web/jaka-to-melodia/.gitignore
          test -f web/jaka-to-melodia/index.html

      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publikuj:
    name: Opublikuj stronę
    needs: zbierz
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
