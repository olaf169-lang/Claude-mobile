name: Aplikacja Android (APK)

on:
  push:
    paths: [".github/workflows/android.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    name: Zbuduj APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Zbuduj APK (debug — instalowalny bez podpisu wydawcy)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: przeglad-news-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Nazwij plik po ludzku
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk przeglad-news.apk

      # Stały adres do pobrania, żeby nie trzeba było szukać w artefaktach:
      # https://github.com/olaf169-lang/Claude-mobile/releases/latest/download/przeglad-news.apk
      - name: Opublikuj jako wydanie do pobrania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Przegląd News — aplikacja na Androida
          body: |
            Najnowsza wersja aplikacji z powiadomieniami o porannym wydaniu.

            **Pobierz:** [przeglad-news.apk](https://github.com/olaf169-lang/Claude-mobile/releases/latest/download/przeglad-news.apk)

            Po instalacji aplikacja sprawdza co trzy godziny, czy pojawiło się
            nowe wydanie, i powiadamia niezależnie od tego, czy jest otwarta.
            Treść aktualizuje się sama — nie trzeba pobierać APK ponownie.
          files: przeglad-news.apk
          make_latest: true
