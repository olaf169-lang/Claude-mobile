<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#8fce8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MANTIS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #6cb673; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #gra { display: block; touch-action: none; }

  /* --- ekran domowy --- */
  #dom {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 12px) + 12px) 16px calc(env(safe-area-inset-bottom, 12px) + 16px);
    background:
      radial-gradient(120% 60% at 75% 0%, rgba(255,251,205,0.95), rgba(255,246,180,0) 60%),
      linear-gradient(180deg, #eaf7cf 0%, #b6e0a0 55%, #6cb673 100%);
  }
  #dom.ukryty { display: none; }
  #dom { overflow-x: hidden; }
  #tytul { font-size: 40px; font-weight: 800; color: #3d5c1e; letter-spacing: .06em; margin-top: 4px; }
  #domModliszka { display: block; width: 240px; height: 150px; }
  #naglowekWyboru { font-size: 15px; font-weight: 700; color: #6a7d4a; letter-spacing: .08em; margin: 2px 0 10px; }
  #karty { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 440px; }
  .karta {
    min-width: 0; background: rgba(255,255,255,0.55); border: 3px solid transparent;
    border-radius: 18px; padding: 8px 6px 10px; text-align: center; position: relative;
    transition: transform .12s, border-color .12s, background .2s;
  }
  .karta.wybrana { border-color: #6e9a33; background: rgba(255,255,255,0.85); transform: translateY(-3px); }
  .karta.zablokowana { opacity: .96; }
  .karta canvas { display: block; width: 100%; max-width: 100%; height: 84px; }
  .karta .nazwa { font-size: 13px; font-weight: 700; color: #3d5c1e; margin-top: 2px; line-height: 1.15; }
  .karta .lac { font-size: 10px; font-style: italic; color: #7a8a5c; }
  .karta .klodka { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 34px; }
  .karta .odznaka { position: absolute; top: 6px; right: 8px; font-size: 16px; }
  #graj {
    margin-top: auto; margin-bottom: 4px; border: 0; border-radius: 22px;
    background: linear-gradient(180deg, #7fb63f, #5d8a2a); color: #fff;
    font-size: 26px; font-weight: 800; letter-spacing: .06em;
    padding: 16px 64px; box-shadow: 0 6px 0 #4a6e22, 0 10px 20px rgba(60,80,30,.35);
  }
  #graj:active { transform: translateY(3px); box-shadow: 0 3px 0 #4a6e22, 0 6px 12px rgba(60,80,30,.35); }

  /* --- przyciski w rogu --- */
  .rogPrzycisk {
    position: fixed; z-index: 15; border: 0; border-radius: 50%;
    width: 46px; height: 46px; font-size: 22px;
    background: rgba(255,255,255,0.7); color: #3d5c1e;
    display: flex; align-items: center; justify-content: center;
  }
  #dzwiek { top: calc(env(safe-area-inset-top, 10px) + 8px); right: calc(env(safe-area-inset-right, 10px) + 10px); }
  #doDomu { top: calc(env(safe-area-inset-top, 10px) + 8px); left: calc(env(safe-area-inset-left, 10px) + 10px); display: none; }
</style>
</head>
<body>
<canvas id="gra"></canvas>

<button id="dzwiek" class="rogPrzycisk" aria-label="dźwięk">🔊</button>
<button id="doDomu" class="rogPrzycisk" aria-label="dom">🏠</button>

<div id="dom">
  <div id="tytul">MANTIS</div>
  <canvas id="domModliszka" width="480" height="300"></canvas>
  <div id="naglowekWyboru">WYBIERZ MODLISZKĘ</div>
  <div id="karty"></div>
  <button id="graj">GRAJ</button>
</div>

<script src="silnik/modliszka.js"></script>
<script src="silnik/swiat.js"></script>
<script src="silnik/owad.js"></script>
<script src="silnik/zapis.js"></script>
<script src="silnik/gra.js"></script>
<script src="silnik/menu.js"></script>
</body>
</html>
